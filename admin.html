<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - دورة GeoGebra</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0a0f2a 0%, #0a1a3a 100%);
            color: #fff;
            padding: 1rem;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
        }
        .logo h1 { font-size: 1.5rem; background: linear-gradient(135deg, #00b4d8, #00e5ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(0,180,216,0.1), rgba(0,119,182,0.1));
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(0,180,216,0.3);
        }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: #00e5ff; }
        .stat-label { font-size: 0.9rem; color: #ccd6f6; }
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .chart-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid rgba(0,180,216,0.2);
        }
        .chart-card h3 { text-align: center; margin-bottom: 1rem; color: #00b4d8; }
        .filters-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }
        .search-box { flex: 2; min-width: 200px; }
        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(0,180,216,0.3);
            background: rgba(0,0,0,0.3);
            color: #fff;
        }
        .filter-select {
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px solid rgba(0,180,216,0.3);
            background: rgba(0,0,0,0.3);
            color: #fff;
        }
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #00b4d8, #0077b6); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #00c853, #00e676); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, #ff6d00, #ffab40); color: #fff; }
        .table-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow-x: auto;
            padding: 1rem;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0,180,216,0.2); color: #00e5ff; }
        .loading { text-align: center; padding: 2rem; color: #00b4d8; }
        .no-data { text-align: center; padding: 2rem; color: #ccd6f6; }
        .btn-small { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #0a0f2a, #0a1a3a);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            text-align: center;
            border: 1px solid #00b4d8;
        }
        @media (max-width: 768px) {
            .filters-card { flex-direction: column; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-chalkboard-user"></i> لوحة تحكم المدرب</h1>
            <p>بن الدين بويعقوب | دورة GeoGebra</p>
        </div>
        <div>
            <button class="btn btn-primary" onclick="loadData()"><i class="fas fa-sync-alt"></i> تحديث</button>
            <button class="btn btn-success" onclick="exportToCSV()"><i class="fas fa-file-excel"></i> تصدير Excel</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">إجمالي المسجلين</div></div>
        <div class="stat-card"><div class="stat-number" id="studentsCount">0</div><div class="stat-label">طلاب</div></div>
        <div class="stat-card"><div class="stat-number" id="teachersCount">0</div><div class="stat-label">أساتذة</div></div>
        <div class="stat-card"><div class="stat-number" id="todayCount">0</div><div class="stat-label">تسجيلات اليوم</div></div>
    </div>

    <div class="charts-section">
        <div class="chart-card"><h3><i class="fas fa-chart-pie"></i> توزيع المسجلين حسب الصفة</h3><canvas id="roleChart"></canvas></div>
        <div class="chart-card"><h3><i class="fas fa-chart-line"></i> التسجيلات حسب اليوم</h3><canvas id="dailyChart"></canvas></div>
    </div>

    <div class="filters-card">
        <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو البريد..." onkeyup="filterTable()"></div>
        <select class="filter-select" id="roleFilter" onchange="filterTable()">
            <option value="all">الكل</option>
            <option value="طالب جامعي">طالب جامعي</option>
            <option value="أستاذ">أستاذ</option>
            <option value="باحث">باحث</option>
        </select>
    </div>

    <div class="table-container">
        <div id="loadingMessage" class="loading">📡 جاري تحميل البيانات...</div>
        <table id="dataTable" style="display: none;">
            <thead><tr><th>#</th><th>الاسم الكامل</th><th>البريد الإلكتروني</th><th>الصفة</th><th>واتساب</th><th>تاريخ التسجيل</th><th>تاريخ الدورة</th><th>رابط الدورة</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="noDataMessage" class="no-data" style="display: none;">📭 لا توجد بيانات لعرضها</div>
    </div>
</div>

<div id="messageModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-info-circle" style="font-size: 3rem; color: #00b4d8;"></i>
        <h3 id="messageTitle">معلومات</h3>
        <p id="messageText"></p>
        <button class="btn btn-primary" onclick="closeMessageModal()">حسناً</button>
    </div>
</div>

<script>
    // رابط doGet من Apps Script (إصدار 8)
    const API_URL = 'https://script.google.com/macros/s/AKfycbzRNddgtM30-RR41ulwhiPLV0KtchPn8a8zrt2DE6QdT5ZxyU06Bc9T8_pZa-sUYKSM/exec';
    
    let allData = [];
    let charts = {};

    async function loadData() {
        try {
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('dataTable').style.display = 'none';
            document.getElementById('noDataMessage').style.display = 'none';
            
            const response = await fetch(`${API_URL}?t=${Date.now()}`);
            const result = await response.json();
            
            console.log("🔍 البيانات المستلمة:", result);
            
            if (result && result.data && Array.isArray(result.data)) {
                allData = result.data;
                if (allData.length === 0) {
                    showMessage('تنبيه', 'لا توجد بيانات في Google Sheets بعد.');
                } else {
                    showMessage('نجاح', `تم تحميل ${allData.length} تسجيل`);
                }
            } else if (result && result.data === undefined) {
                allData = [];
                showMessage('تنبيه', 'البيانات غير موجودة. تأكد من وجود تسجيلات.');
            } else {
                allData = [];
                showMessage('خطأ', 'فشل في تحميل البيانات');
            }
            
            updateUI();
        } catch (error) {
            console.error('❌ خطأ:', error);
            showMessage('خطأ', 'تعذر الاتصال بخادم البيانات');
            allData = [];
            updateUI();
        } finally {
            document.getElementById('loadingMessage').style.display = 'none';
        }
    }

    function updateUI() {
        updateStats();
        updateCharts();
        filterTable();
    }

    function updateStats() {
        const total = allData.length;
        const students = allData.filter(d => d.role === 'طالب جامعي').length;
        const teachers = allData.filter(d => d.role === 'أستاذ').length;
        const today = new Date().toDateString();
        const todayCount = allData.filter(d => {
            if (!d.registrationDate && !d['تاريخ التسجيل']) return false;
            const dateStr = d.registrationDate || d['تاريخ التسجيل'];
            return new Date(dateStr).toDateString() === today;
        }).length;
        
        document.getElementById('totalCount').innerText = total;
        document.getElementById('studentsCount').innerText = students;
        document.getElementById('teachersCount').innerText = teachers;
        document.getElementById('todayCount').innerText = todayCount;
    }

    function updateCharts() {
        const roles = {};
        allData.forEach(d => {
            const role = d.role || d['الصفة'] || 'غير محدد';
            roles[role] = (roles[role] || 0) + 1;
        });
        
        const ctx1 = document.getElementById('roleChart').getContext('2d');
        if (charts.roleChart) charts.roleChart.destroy();
        charts.roleChart = new Chart(ctx1, {
            type: 'pie',
            data: {
                labels: Object.keys(roles),
                datasets: [{ data: Object.values(roles), backgroundColor: ['#00b4d8', '#00e5ff', '#ff6d00', '#00c853'] }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
        });
        
        const daily = {};
        const last7Days = [...Array(7)].map((_, i) => {
            const d = new Date(); d.setDate(d.getDate() - i); return d.toDateString();
        }).reverse();
        last7Days.forEach(day => daily[day] = 0);
        allData.forEach(d => {
            const dateStr = d.registrationDate || d['تاريخ التسجيل'];
            if (dateStr) {
                const day = new Date(dateStr).toDateString();
                if (daily[day] !== undefined) daily[day]++;
            }
        });
        
        const ctx2 = document.getElementById('dailyChart').getContext('2d');
        if (charts.dailyChart) charts.dailyChart.destroy();
        charts.dailyChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: last7Days.map(d => d.slice(0, 10)),
                datasets: [{ label: 'عدد المسجلين', data: last7Days.map(d => daily[d]), borderColor: '#00b4d8', fill: true, tension: 0.3 }]
            },
            options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { y: { ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } } }
        });
    }

    function filterTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const roleFilter = document.getElementById('roleFilter').value;
        
        let filtered = allData.filter(d => {
            const role = d.role || d['الصفة'] || '';
            if (roleFilter !== 'all' && role !== roleFilter) return false;
            if (search) {
                const name = (d.fullname || d['الاسم الكامل'] || '').toLowerCase();
                const email = (d.email || d['البريد الإلكتروني'] || '').toLowerCase();
                if (!name.includes(search) && !email.includes(search)) return false;
            }
            return true;
        });
        
        displayTable(filtered);
    }

    function displayTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        if (data.length === 0) {
            document.getElementById('dataTable').style.display = 'none';
            document.getElementById('noDataMessage').style.display = 'block';
            return;
        }
        
        document.getElementById('dataTable').style.display = 'table';
        document.getElementById('noDataMessage').style.display = 'none';
        
        data.forEach((row, idx) => {
            const tr = tbody.insertRow();
            tr.insertCell(0).innerText = idx + 1;
            tr.insertCell(1).innerText = row.fullname || row['الاسم الكامل'] || '-';
            tr.insertCell(2).innerText = row.email || row['البريد الإلكتروني'] || '-';
            tr.insertCell(3).innerHTML = `<span style="background:rgba(0,180,216,0.2);padding:0.2rem 0.8rem;border-radius:20px;">${row.role || row['الصفة'] || '-'}</span>`;
            tr.insertCell(4).innerHTML = `<a href="https://wa.me/${(row.whatsapp || row['رقم واتساب'] || '').replace(/^0/, '213')}" target="_blank" style="color:#25D366;"><i class="fab fa-whatsapp"></i> ${row.whatsapp || row['رقم واتساب'] || '-'}</a>`;
            tr.insertCell(5).innerText = row.registrationDate || row['تاريخ التسجيل'] ? new Date(row.registrationDate || row['تاريخ التسجيل']).toLocaleString() : '-';
            tr.insertCell(6).innerText = row.courseDate || row['تاريخ الدورة'] || '2026-06-13';
            tr.insertCell(7).innerHTML = `<a href="${row.meetLink || row['رابط الميت'] || 'https://meet.google.com/uvb-updz-anc'}" target="_blank" style="color:#00b4d8;"><i class="fab fa-google"></i> رابط</a>`;
        });
    }

    function exportToCSV() {
        if (allData.length === 0) { showMessage('تنبيه', 'لا توجد بيانات للتصدير'); return; }
        let csv = [['الاسم', 'البريد', 'الصفة', 'واتساب', 'تاريخ التسجيل', 'تاريخ الدورة']];
        allData.forEach(d => {
            csv.push([
                d.fullname || d['الاسم الكامل'] || '',
                d.email || d['البريد الإلكتروني'] || '',
                d.role || d['الصفة'] || '',
                d.whatsapp || d['رقم واتساب'] || '',
                d.registrationDate || d['تاريخ التسجيل'] || '',
                d.courseDate || d['تاريخ الدورة'] || ''
            ]);
        });
        const blob = new Blob(['\uFEFF' + csv.map(row => row.join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `geogebra_data_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        showMessage('تم التصدير', 'تم تصدير البيانات بنجاح');
    }

    function showMessage(title, msg) {
        document.getElementById('messageTitle').innerText = title;
        document.getElementById('messageText').innerText = msg;
        document.getElementById('messageModal').style.display = 'flex';
    }

    function closeMessageModal() {
        document.getElementById('messageModal').style.display = 'none';
    }

    loadData();
</script>
</body>
</html>
